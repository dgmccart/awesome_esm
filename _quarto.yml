project:
  type: website
  output-dir: docs

website:
  title: "Awesome ESM"
  description: "A curated collection of ESM resources, papers, and community examples"
  site-url: https://dgmccart.github.io/awesome_esm/
  
  # Favicon
  favicon: assets/images/biohub-favicon.png
  
  # Search
  search: true
  
  # Navigation bar
  navbar:
    background: "#FFFFFF"
    logo: assets/images/esm_header.png
    logo-alt: "Awesome ESM Logo"
    
    left:
      - text: "Get Started"
        href: getting-started/index.qmd
      - text: "Use Cases"
        href: use-cases/index.qmd
      - text: "Tutorials"
        href: tutorials.qmd
      - text: "Workshops"
        href: workshops.qmd
      - text: "FAQ"
        href: faq.qmd
      - text: "Get Involved"
        href: get-involved.qmd
    
    right:
      - icon: github
        href: https://github.com/dgmccart/awesome_esm
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/biohubcz
        aria-label: Twitter

  # Footer
  page-footer:
    background: "#F9FAFB"
    left: |
      © 2025 Biohub. Made with ❤️ by the community.
    center: |
      Part of the [ESM project](https://biohub.ai) • [License](https://github.com/Biohub/awesome-esm/blob/main/LICENSE)
    right: |
      [GitHub](https://github.com/Biohub/awesome-esm) • [Slack](https://biohub.slack.com) • [Contact](https://biohub.ai/contact)

  # Sidebar for nested pages
  sidebar:
    - id: getting-started
      contents:
        - getting-started/index.qmd
        - getting-started/model-comparison.qmd
        - getting-started/decision-tree.qmd
    
    - id: use-cases
      contents:
        - use-cases/index.qmd
        - use-cases/model-development.qmd
        - use-cases/model-applications.qmd

# Styling
format:
  html:
    theme:
      light:
        - cosmo
        - assets/css/styles.scss
      dark:
        - darkly
        - assets/css/styles.scss
    
    # Layout
    page-layout: full
    toc: true
    toc-depth: 2
    toc-expand: 1
    
    # Code formatting
    highlight-style: atom-one
    code-block-border-left: true
    code-copy: true
    
    # Font Size
    fontsize: 14px
    # mainfont: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif
    
    # Spacing
    margin-top: 1rem
    margin-bottom: 1rem

# Metadata
execute:
  freeze: auto
