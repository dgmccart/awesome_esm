project:
  type: website
  output-dir: _site

website:
  title: "Awesome ESM"
  description: "A curated collection of ESM resources, papers, tutorials, and community examples"

  site-url: https://dgmccart.github.io/awesome_esm/

  favicon: assets/images/biohub_favicon.png

  repo-url: https://github.com/dgmccart/awesome_esm
  repo-actions: [source]

  sidebar:
    style: "docked"
    search: true
    collapse-level: 1
    alignment: left

    logo: assets/images/esm_header_new.png
    logo-alt: Awesome ESM

    contents:
      - href: index.qmd
        text: Home

      - section: Getting Started
        contents:
          - getting-started/index.qmd
          - getting-started/model-comparison.qmd
          - getting-started/decision-tree.qmd

      - section: Use Cases
        contents:
          - use-cases/index.qmd
          - use-cases/model-development.qmd
          - use-cases/model-applications.qmd

      - href: tutorials.qmd
        text: Tutorials

      - href: workshops.qmd
        text: Workshops

      - href: faq.qmd
        text: FAQ

      - href: get-involved.qmd
        text: Get Involved

      - text: |
          <div class="sidebar-links">
            <a href="https://biohub.ai" target="_blank">🌐 Biohub</a>
            <a href="https://huggingface.co/biohub" target="_blank">🤗 Hugging Face</a>
            <a href="https://github.com/Biohub/esm" target="_blank">💻 GitHub</a>
            <a href="https://biohub.ai/resources/tutorials" target="_blank">📚 Tutorials</a>
          </div>

  page-footer:
    left: |
      [Privacy Policy](https://biohub.org/privacy-policy/) |
      [Terms of Use](https://biohub.org/terms-of-use/) |
      [DMCA Policy](https://biohub.org/dmca-policy/) |
      [Ethics](https://biohub.org/ethics/) |
      [Acceptable Use Policy](https://biohub.org/acceptable-use-policy/)

    right: |
      <img src="assets/images/biohub_white_text.png"
          alt="Biohub"
          class="footer-logo">

# Styling
format:
  html:
    theme:
      light:
        - cosmo
        - assets/css/styles.scss
        - assets/css/custom.scss
      dark:
        - darkly
        - assets/css/styles.scss
        - assets/css/custom.scss
    
    include-after-body:
      - assets/js/cards.js
        
    # Layout
    page-layout: full
    toc: true
    toc-depth: 2
    toc-expand: 1
    
    # Code formatting
    highlight-style: atom-one
    code-block-border-left: true
    code-copy: true
    
    # Font Size
    fontsize: 14px
    
    # Spacing
    margin-top: 1rem
    margin-bottom: 1rem

# Metadata
execute:
  freeze: auto
